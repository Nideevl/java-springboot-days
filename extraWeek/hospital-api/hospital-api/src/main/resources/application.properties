spring.application.name=hospital-api
spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=aB9$mK2@xL5#pQ8!vR3%tW6^yU1&zX4*cD7(eF0)gH-jI_kJ+lM=nO?oPaS.qT,uV;wX/yZ
app.jwt.expiration=86400000

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.hospital=DEBUG